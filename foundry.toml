[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"

# Deliberate: tests deploy unoptimized, and the tree now holds two full staker contracts
# (the frozen src/versions/v1/StableStakerV1.sol and the evergreen src/StableStakerV2.sol).
# `forge build --sizes` over the EIP-170 limit here is expected and is NOT a defect.
# This is NOT the deployment profile - that lives in phase-2-staging (optimizer,
# optimizer_runs = 10000, via_ir), where the deployed artifact is well under the limit.
code_size_limit = 100000
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    # The `flax-token/` remapping NAME is retained deliberately even though it now points
    # inside the frozen V1 directory. Keeping the name is what spares every import site --
    # the two hash-pinned frozen files (src/versions/v1/StableStakerV1.sol,
    # IStableStakerV1.sol) and the V1-covering tests -- from any change at all. The
    # frozen files are pinned in src/versions/v1/FROZEN.sha256, so their import lines
    # cannot be rewritten; the redirection happens here instead. Story 024 vendored
    # IFlax.sol and FlaxToken.sol from Behodler/flax-token-v2@f5300117 and dropped the
    # lib/flax-token submodule. Retiring V1 = delete src/versions/v1/ AND remove this
    # line (and its twin in remappings.txt).
    "flax-token/=src/versions/v1/vendor/",
    "pauser/=lib/pauser/src/",
    "reflax-yield-vault/=lib/reflax-yield-vault/src/",
    "antimatter/=lib/antimatter/src/",
    "@phUSD/=lib/antimatter/lib/flax-token-v2/src/",
    "@phUSDMinter/=lib/antimatter/lib/phUSD-stable-minter/src/",
    "@pauser/=lib/antimatter/lib/pauser/src/",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
